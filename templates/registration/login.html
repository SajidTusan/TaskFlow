{% extends "base.html" %}


{% block title %}
Login | TaskFlow
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Welcome Back 👋
    </h1>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit">
            Login
        </button>

    </form>


    <p>

        Don't have an account?

        <a
            href="{% url 'register' %}"
        >
            Register
        </a>

    </p>

</div>

{% endblock %}
